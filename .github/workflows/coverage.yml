name: Coverage

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest

    env:
      GO111MODULE: on
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic
        if: "!(github.event_name == 'pull_request')"
      - name: Remove stale generated report evidence
        id: report_cleanup
        if: "!cancelled() && (github.event_name == 'pull_request')"
        shell: bash
        run: |
          set -euo pipefail
          test ! -L .github
          rm -f -- .github/go-test-report.md .github/go-test-report.json .github/coverage.svg .github/goreportcard.svg .github/goreportcard-report.md
          rm -rf -- .github/test-results
      - name: Test, race and coverage (GTR v1.1.3)
        id: go_test_report
        uses: soulteary/go-test-report-action@2760569379a1c95a195c602872ba00cd61495d89  # v1.1.3
        with:
          directory: "."
          packages: "./..."
          race: "true"
          coverage_threshold: "0"
          test_args: "-count=1"
          version: "v1.1.3"
          cover_mode: "atomic"
          commit: "false"
        if: github.event_name == 'pull_request'
      - name: Go quality report (v1.1.7)
        if: "!cancelled() && (github.event_name == 'pull_request') && steps.report_cleanup.outcome == 'success'"
        id: go_report_card
        uses: soulteary/goreportcard-action@9744d0297ca0116cd4ef83e4ff6f3ba42a65a24d  # v1.1.7
        with:
          directory: "."
          version: "v1.1.7"
          threshold: "0"
          report: "true"
          commit: "false"
      - name: Reuse GTR coverage profile
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PROFILE: ${{ steps.go_test_report.outputs.coverage_profile }}
        run: |-
          cp "$PROFILE" coverage.out
      - name: Upload read-only PR quality evidence
        if: "always() && steps.report_cleanup.outcome == 'success' && ((github.event_name == 'pull_request'))"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-go-quality-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/go-test-report.md
            .github/go-test-report.json
            .github/coverage.svg
            .github/goreportcard.svg
            .github/goreportcard-report.md
            .github/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
    permissions:
      contents: read
